<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Radiant Sun Rays -->
  <g fill="url(#sunGrad)">
    <path d="M 60 210 C 90 200, 110 220, 160 216 C 130 200, 110 180, 100 176 C 80 176, 66 196, 60 210 Z" />
    <path d="M 90 150 C 120 136, 134 164, 180 176 C 154 150, 134 120, 126 110 C 106 120, 94 136, 90 150 Z" />
    <path d="M 146 80 C 166 60, 186 100, 214 136 C 194 96, 180 60, 170 44 C 154 56, 146 68, 146 80 Z" />
    <path d="M 200 24 C 190 56, 210 90, 200 136 C 210 96, 230 56, 220 24 C 210 36, 204 30, 200 24 Z" />
    <path d="M 254 80 C 234 60, 214 100, 186 136 C 206 96, 220 60, 230 44 C 246 56, 254 68, 254 80 Z" />
    <path d="M 310 150 C 280 136, 266 164, 220 176 C 246 150, 266 120, 274 110 C 294 120, 306 136, 310 150 Z" />
    <path d="M 340 210 C 310 200, 290 220, 240 216 C 270 200, 290 180, 300 176 C 320 176, 334 196, 340 210 Z" />
  </g>

  <!-- Sun Disc -->
  <path d="M 100 220 A 100 100 0 0 1 300 220 Z" fill="url(#discGrad)" stroke="#EA580C" stroke-width="2.5" />

  <!-- Meditating Yogi Silhouette -->
  <g fill="#0F384C">
    <circle cx="200" cy="152" r="11" />
    <path d="M 200 166 C 188 166, 182 174, 178 184 L 184 198 L 216 198 L 222 184 C 218 174, 212 166, 200 166 Z" />
    <path d="M 172 196 C 168 200, 160 210, 170 216 C 184 218, 216 218, 230 216 C 240 210, 232 200, 228 196 C 220 200, 180 200, 172 196 Z" />
    <circle cx="200" cy="194" r="5" />
  </g>

  <!-- Brand Wordmark "pragya" -->
  <text x="200" y="295" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="56" fill="#0F384C" text-anchor="middle" letter-spacing="4">pragya</text>
  
  <!-- Shirorekha Top Line -->
  <rect x="70" y="248" width="260" height="4.5" rx="2" fill="#0F384C" />

  <!-- Tagline "Where Science Meets Spirituality" -->
  <text x="200" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#0F384C" text-anchor="middle" letter-spacing="2">Where Science Meets Spirituality</text>
</svg>
